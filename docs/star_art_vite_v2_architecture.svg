<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980">
  <defs>
    <style>
      .bg { fill: #fbfcff; }
      .title { font: 800 34px Arial, Helvetica, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #5b6472; }
      .panel { fill: #ffffff; stroke: #cfd7e6; stroke-width: 2.2; rx: 18; }
      .panel-title { font: 800 22px Arial, Helvetica, sans-serif; fill: #101828; }
      .panel-note { font: 400 13px Arial, Helvetica, sans-serif; fill: #667085; }
      .box { stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .cyan { fill: #ecfeff; stroke: #0891b2; }
      .green { fill: #ecfdf3; stroke: #16a34a; }
      .lime { fill: #f0fdf4; stroke: #65a30d; }
      .yellow { fill: #fffbeb; stroke: #f59e0b; }
      .orange { fill: #fff7ed; stroke: #f97316; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; }
      .pink { fill: #fff1f2; stroke: #e11d48; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .dark { fill: #111827; stroke: #111827; }
      .label { font: 800 17px Arial, Helvetica, sans-serif; fill: #101828; }
      .small-label { font: 800 14px Arial, Helvetica, sans-serif; fill: #101828; }
      .text { font: 400 13px Arial, Helvetica, sans-serif; fill: #344054; }
      .dim { font: 800 13px Arial, Helvetica, sans-serif; fill: #475467; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #667085; }
      .white-label { font: 800 15px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .white-text { font: 400 12px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.8; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #7b8794; stroke-width: 2.1; marker-end: url(#arrowSoft); }
      .dash { fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 7 7; }
      .node-blue { fill: #60a5fa; stroke: #1d4ed8; stroke-width: 2; }
      .node-orange { fill: #fbbf24; stroke: #d97706; stroke-width: 2; }
      .node-green { fill: #86efac; stroke: #16a34a; stroke-width: 2; }
      .node-pink { fill: #fda4af; stroke: #be123c; stroke-width: 2; }
      .node-gray { fill: #d0d5dd; stroke: #667085; stroke-width: 2; }
      .edge { stroke: #667085; stroke-width: 2; }
      .edge-strong { stroke: #2563eb; stroke-width: 3; }
      .edge-dash { stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 5 5; }
      .badge { fill: #111827; rx: 8; }
      .badge-text { font: 800 12px Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="980"/>

  <text class="title" x="70" y="58">STAR-ART-ViTE v2: Simplified Model Architecture</text>
  <text class="subtitle" x="70" y="88">A clean paper-style overview of the actual code path: STAR batch format, ART relation graph, AIP pruning, ViTE-style experts, and K future heads</text>
  <rect class="badge" x="1380" y="38" width="425" height="36"/>
  <text class="badge-text" x="1400" y="61">Tobs=8 | P=12 | D=model_dim | K=sample_num | Nv=valid agents</text>

  <!-- Panel A -->
  <rect class="panel" x="55" y="130" width="350" height="650"/>
  <text class="panel-title" x="85" y="168">A. Observation Encoder</text>
  <text class="panel-note" x="85" y="191">STAR dataloader interface is kept</text>

  <rect class="box blue" x="90" y="225" width="280" height="78"/>
  <text class="label" x="112" y="254">Input batch</text>
  <text class="text" x="112" y="279">nodes_norm, seq_list, nei_list</text>
  <text class="dim" x="112" y="299">[T, N, 2]</text>

  <path class="arrow-soft" d="M230 303 V330"/>

  <rect class="box cyan" x="90" y="330" width="280" height="82"/>
  <text class="label" x="112" y="360">Valid-agent filter</text>
  <text class="text" x="112" y="385">observed in all Tobs frames</text>
  <text class="dim" x="112" y="406">[Tobs, Nv, 2]</text>

  <path class="arrow-soft" d="M230 412 V440"/>

  <rect class="box green" x="90" y="440" width="280" height="82"/>
  <text class="label" x="112" y="470">Position + velocity</text>
  <text class="text" x="112" y="495">concat [x, y, vx, vy]</text>
  <text class="dim" x="112" y="516">[8, Nv, 4]</text>

  <path class="arrow-soft" d="M230 522 V550"/>

  <rect class="box lime" x="90" y="550" width="280" height="105"/>
  <text class="label" x="112" y="580">Temporal Transformer</text>
  <text class="text" x="112" y="608">Linear 4->D + PE + encoder</text>
  <text class="dim" x="112" y="631">H(t) [8, Nv, D]</text>
  <text class="dim" x="112" y="650">H0 [Nv, D]</text>

  <rect class="box gray" x="90" y="690" width="280" height="58"/>
  <text class="small-label" x="112" y="715">Carried forward</text>
  <text class="text" x="112" y="738">H(t), H0, last position, nei_list</text>

  <!-- Panel B -->
  <rect class="panel" x="460" y="130" width="380" height="650"/>
  <text class="panel-title" x="490" y="168">B. Relation Graph Builder</text>
  <text class="panel-note" x="490" y="191">All matrices are block diagonal by scene</text>

  <rect class="box purple" x="495" y="225" width="310" height="115"/>
  <text class="label" x="518" y="255">ART temporal relation graph</text>
  <text class="text" x="518" y="282">pairwise temporal Q/K/V attention</text>
  <text class="text" x="518" y="304">edge score uses both directions</text>
  <text class="dim" x="518" y="327">Wart [Nv,Nv], R [Nv,Nv,D]</text>

  <line class="edge" x1="740" y1="251" x2="762" y2="290"/>
  <line class="edge-strong" x1="740" y1="251" x2="718" y2="306"/>
  <line class="edge-dash" x1="762" y1="290" x2="718" y2="306"/>
  <circle class="node-blue" cx="740" cy="251" r="8"/>
  <circle class="node-orange" cx="762" cy="290" r="8"/>
  <circle class="node-green" cx="718" cy="306" r="8"/>

  <path class="arrow-soft" d="M650 340 V367"/>

  <rect class="box yellow" x="495" y="367" width="310" height="105"/>
  <text class="label" x="518" y="397">STAR spatial prior</text>
  <text class="text" x="518" y="424">last-observed distance + nei_list</text>
  <text class="text" x="518" y="445">row-max normalized</text>
  <text class="dim" x="518" y="466">Wsp [Nv,Nv]</text>

  <path class="arrow-soft" d="M650 472 V500"/>

  <rect class="box orange" x="495" y="500" width="310" height="78"/>
  <text class="label" x="518" y="530">Relation mixing</text>
  <text class="text" x="518" y="557">W = (1-lambda) Wart + lambda Wsp</text>

  <path class="arrow-soft" d="M650 578 V607"/>

  <rect class="box pink" x="495" y="607" width="310" height="105"/>
  <text class="label" x="518" y="637">Adaptive interaction pruning</text>
  <text class="text" x="518" y="664">row-wise cumulative top-p</text>
  <text class="text" x="518" y="685">renormalized sparse graph</text>
  <text class="dim" x="518" y="706">A [Nv,Nv]</text>

  <rect x="748" y="634" width="10" height="45" fill="#60a5fa"/>
  <rect x="765" y="649" width="10" height="30" fill="#86efac"/>
  <rect x="782" y="664" width="10" height="15" fill="#fda4af"/>
  <line x1="742" y1="653" x2="800" y2="653" stroke="#667085" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Panel C -->
  <rect class="panel" x="895" y="130" width="535" height="650"/>
  <text class="panel-title" x="925" y="168">C. Interaction Modeling</text>
  <text class="panel-note" x="925" y="191">Local relation encoding + ViTE-style two-expert MoE</text>

  <rect class="box purple" x="925" y="225" width="470" height="108"/>
  <text class="label" x="948" y="255">Edge-aware relational Transformer x L</text>
  <text class="text" x="948" y="282">inputs: H0 node states, ART edge feature R, pruned adjacency A</text>
  <text class="text" x="948" y="304">node attention is masked and biased by A</text>
  <text class="dim" x="948" y="326">Hpair [Nv,D]</text>

  <path class="arrow-soft" d="M1160 333 V365"/>

  <rect class="box dark" x="1010" y="365" width="300" height="75"/>
  <text class="white-label" x="1035" y="394">Expert Router</text>
  <text class="white-text" x="1035" y="418">softmax + noisy top-p over two experts</text>
  <text class="white-label" x="1215" y="418">G [Nv,2]</text>

  <path class="arrow-soft" d="M1085 440 V470"/>
  <path class="arrow-soft" d="M1235 440 V470"/>

  <rect class="box green" x="925" y="470" width="230" height="125"/>
  <text class="label" x="948" y="500">One-hop expert</text>
  <text class="text" x="948" y="527">direct neighbor aggregation</text>
  <text class="text" x="948" y="548">uses Hpair and A</text>
  <text class="dim" x="948" y="573">H1hop [Nv,D]</text>

  <line class="edge-strong" x1="1100" y1="505" x2="1068" y2="560"/>
  <line class="edge" x1="1100" y1="505" x2="1128" y2="555"/>
  <line class="edge" x1="1100" y1="505" x2="1055" y2="512"/>
  <circle class="node-blue" cx="1100" cy="505" r="8"/>
  <circle class="node-orange" cx="1068" cy="560" r="8"/>
  <circle class="node-green" cx="1128" cy="555" r="8"/>
  <circle class="node-gray" cx="1055" cy="512" r="8"/>

  <rect class="box cyan" x="1165" y="470" width="230" height="125"/>
  <text class="label" x="1188" y="500">High-order expert</text>
  <text class="text" x="1188" y="527">M learnable virtual nodes</text>
  <text class="text" x="1188" y="548">real -> virtual -> real</text>
  <text class="dim" x="1188" y="573">Hhigh [Nv,D]</text>

  <rect x="1342" y="503" width="12" height="12" fill="#111827" rx="2"/>
  <rect x="1362" y="503" width="12" height="12" fill="#111827" rx="2"/>
  <line class="edge-dash" x1="1348" y1="509" x2="1308" y2="556"/>
  <line class="edge-dash" x1="1368" y1="509" x2="1286" y2="543"/>
  <circle class="node-orange" cx="1308" cy="556" r="8"/>
  <circle class="node-blue" cx="1286" cy="543" r="8"/>
  <circle class="node-green" cx="1328" cy="565" r="8"/>

  <path class="arrow-soft" d="M1040 595 V627"/>
  <path class="arrow-soft" d="M1280 595 V627"/>

  <rect class="box orange" x="1010" y="627" width="300" height="85"/>
  <text class="label" x="1035" y="657">Weighted MoE fusion</text>
  <text class="text" x="1035" y="684">G0 * H1hop + G1 * Hhigh</text>
  <text class="dim" x="1035" y="705">Hroute [Nv,D]</text>

  <!-- Panel D -->
  <rect class="panel" x="1485" y="130" width="360" height="650"/>
  <text class="panel-title" x="1515" y="168">D. Multi-head Decoder</text>
  <text class="panel-note" x="1515" y="191">One forward pass produces K futures</text>

  <rect class="box gray" x="1520" y="245" width="290" height="105"/>
  <text class="label" x="1543" y="276">Feature stack</text>
  <text class="text" x="1543" y="304">concat H0, Hpair, Hroute</text>
  <text class="dim" x="1543" y="328">[Nv,3D]</text>

  <path class="arrow-soft" d="M1665 350 V392"/>

  <rect class="box yellow" x="1520" y="392" width="290" height="130"/>
  <text class="label" x="1543" y="423">K residual decoder heads</text>
  <text class="text" x="1543" y="451">independent MLP heads</text>
  <text class="text" x="1543" y="472">+ constant-velocity baseline</text>
  <text class="dim" x="1543" y="499">K x [P,Nv,2]</text>
  <rect x="1740" y="414" width="28" height="24" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <rect x="1746" y="421" width="28" height="24" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <rect x="1752" y="428" width="28" height="24" fill="#fff" stroke="#f59e0b" stroke-width="2" rx="4"/>

  <path class="arrow-soft" d="M1665 522 V565"/>

  <rect class="box blue" x="1520" y="565" width="290" height="100"/>
  <text class="label" x="1543" y="596">Scatter to original agents</text>
  <text class="text" x="1543" y="624">invalid agents remain masked</text>
  <text class="dim" x="1543" y="648">pred [K,P,N,2]</text>

  <rect class="box green" x="1520" y="690" width="290" height="58"/>
  <text class="small-label" x="1543" y="716">Evaluation</text>
  <text class="text" x="1543" y="739">minADE_K / minFDE_K</text>

  <!-- Inter-panel arrows, intentionally few and straight -->
  <path class="arrow" d="M405 455 H460"/>
  <text class="tiny" x="414" y="438">H(t), H0</text>
  <path class="arrow" d="M840 455 H895"/>
  <text class="tiny" x="850" y="438">A, R, H0</text>
  <path class="arrow" d="M1430 455 H1485"/>
  <text class="tiny" x="1438" y="438">H0, Hpair, Hroute</text>

  <!-- Bottom ablation and objective strip -->
  <rect class="panel" x="55" y="825" width="1790" height="105"/>
  <text class="panel-title" x="85" y="860">Training Objective and Ablation Map</text>
  <text class="panel-note" x="85" y="883">Training uses masked Best-of-K ADE/FDE plus optional router balance and diversity terms. Testing uses the same forward path and reports minADE_K/minFDE_K.</text>

  <rect class="box green" x="90" y="900" width="255" height="42"/>
  <text class="small-label" x="112" y="926">motion_only: A only</text>

  <rect class="box yellow" x="365" y="900" width="280" height="42"/>
  <text class="small-label" x="387" y="926">spatial_only: A+B without ART</text>

  <rect class="box purple" x="665" y="900" width="250" height="42"/>
  <text class="small-label" x="687" y="926">art_only: TARG no AIP</text>

  <rect class="box pink" x="935" y="900" width="250" height="42"/>
  <text class="small-label" x="957" y="926">art_aip: TARG + AIP</text>

  <rect class="box cyan" x="1205" y="900" width="250" height="42"/>
  <text class="small-label" x="1227" y="926">vite_only: experts only</text>

  <rect class="box gray" x="1475" y="900" width="310" height="42"/>
  <text class="small-label" x="1497" y="926">no_motion_prior: remove velocity baseline</text>
</svg>
